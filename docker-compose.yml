services:
  redis:
    image: redis:8.6.6-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    environment:
      STORE_MODE: redis
      REDIS_URL: redis://redis:6379
      FAILURE_POLICY: open
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  toxiproxy:
    profiles: ["chaos"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "6380:6380"
    depends_on:
      redis:
        condition: service_healthy
