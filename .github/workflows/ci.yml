name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.6.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Ensure README is the only tracked documentation
        run: |
          if git ls-files docs | grep -q .; then
            echo "The docs directory must remain local-only"
            exit 1
          fi
          if git ls-files '*.md' | grep -vFx README.md | grep -q .; then
            echo "README.md must be the only tracked Markdown document"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:redis
        env:
          REDIS_URL: redis://localhost:6379
